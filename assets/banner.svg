<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="100%" height="200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f2027" />
      <stop offset="50%" stop-color="#203a43" />
      <stop offset="100%" stop-color="#2c5364" />
    </linearGradient>
  </defs>
  <rect width="800" height="200" fill="url(#bg)" rx="15" ry="15"/>
  <text x="400" y="90" fill="#ffffff" font-family="Arial, sans-serif" font-size="42" font-weight="bold" text-anchor="middle" alignment-baseline="middle">Awesome Solid Waste Routing</text>
  <text x="400" y="130" fill="#64ffda" font-family="Arial, sans-serif" font-size="20" text-anchor="middle">Curated list of platforms and open-source tools</text>
  <!-- Moving element to make it dynamic -->
  <circle cx="50" cy="180" r="8" fill="#4caf50">
    <animate attributeName="cx" values="50;750;50" dur="6s" repeatCount="indefinite" />
  </circle>
  <circle cx="20" cy="180" r="8" fill="#4caf50">
    <animate attributeName="cx" values="20;720;20" dur="6s" repeatCount="indefinite" />
  </circle>
</svg>
